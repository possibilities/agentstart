setup: ~/code/agentwork
prefix: ctrl+space

directories:
  code:
    path: ~/code
  worktrees:
    path: ~/worktrees

harnesses:
  claude:
    command: claude-native
    default-model: opus-1m
    default-effort: xhigh
  codex:
    command: codex-native
    default-model: gpt-5.6-sol
    default-effort: high

panels:
  left:
    command: tray
    description: The agent list
    needs-agents: true
    visible: true
    width: 26
  drawer:
    command: agentmux screen --text drawer
    description: ""
    needs-agents: false
    visible: false
    height: 8
  dock:
    command: agentmux screen --text dock
    description: ""
    needs-agents: false
    visible: false
    width: 40
  right:
    command: agentmux screen --text right
    description: ""
    needs-agents: false
    visible: false
    width: 40
