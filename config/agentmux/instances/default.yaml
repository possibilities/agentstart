setup: ~/code/agentwork

directories:
  code:
    path: ~/code
  worktrees:
    path: ~/worktrees
  source:
    path: ~/source

harnesses:
  claude:
    command: claude-native
    default-model: opus-1m
    default-effort: xhigh
  codex:
    command: codex-native
    default-model: gpt-5.6-sol
    default-effort: high

panels:
  left:
    command: tray
    description: The agent list
    needs-agents: false
    visible: true
    width: 26
